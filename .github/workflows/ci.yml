# Maintainer-facing continuous integration for ELARA's Python tooling.
# Researchers never need this; they run scripts/doctor.py locally instead.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependency
        run: python -m pip install -r requirements.txt
      - name: Validate the workflow contract
        run: python scripts/validate_workflow.py
      - name: Check generated skill wrappers
        run: python scripts/sync_skill_wrappers.py --check
      - name: Run the test suite
        run: python -m unittest discover -s tests -v
